name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libxml2-utils

      - name: Extract project
        shell: bash
        run: |
          set -e

          ZIP_FILE="personality_analyzer_ui_admob_test.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP_FILE" -d extracted

          PUBSPEC=$(find extracted -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Migrate Android v1 to v2
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          echo "Fixing MainActivity..."

          find android/app/src/main -type f \
            \( -name "MainActivity.java" -o -name "MainActivity.kt" \) \
            -print

          while IFS= read -r FILE; do
            sed -i \
              's/io\.flutter\.app\.FlutterActivity/io.flutter.embedding.android.FlutterActivity/g' \
              "$FILE"

            sed -i \
              '/GeneratedPluginRegistrant/d' \
              "$FILE"

          done < <(
            find android/app/src/main -type f \
              \( -name "MainActivity.java" -o -name "MainActivity.kt" \)
          )

          echo "Fixing AndroidManifest..."

          sed -i \
            's/io\.flutter\.app\.FlutterActivity/io.flutter.embedding.android.FlutterActivity/g' \
            "$MANIFEST"

          sed -i \
            's/android:name="flutterEmbedding"[[:space:]]*android:value="1"/android:name="flutterEmbedding" android:value="2"/g' \
            "$MANIFEST"

          if ! grep -q 'android:name="flutterEmbedding"' "$MANIFEST"; then
            sed -i '/<application /a\
        <meta-data android:name="flutterEmbedding" android:value="2" />' "$MANIFEST"
          fi

          echo "Checking AndroidManifest XML..."

          xmllint --noout "$MANIFEST"

          echo "AndroidManifest.xml is valid."

      - name: Fix AdMob dependency
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          sed -i -E \
            's/^([[:space:]]*google_mobile_ads:).*/\1 ^7.0.0/' \
            pubspec.yaml

          echo "AdMob dependency:"
          grep "google_mobile_ads:" pubspec.yaml

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personality-analyzer-arabic-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
