name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y unzip libxml2-utils

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="personality_analyzer_ui_admob_test.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PUBSPEC=""

          while IFS= read -r FILE; do
            PUBSPEC="$FILE"
            break
          done < <(
            find extracted \
              -type f \
              -name "pubspec.yaml" \
              -not -path "*/__MACOSX/*" \
              -not -path "*/.*/*"
          )

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Fix AdMob dependency
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if grep -qE '^[[:space:]]+google_mobile_ads:' pubspec.yaml; then
            sed -i -E \
              's/^([[:space:]]+google_mobile_ads:)[[:space:]]*.*/\1 ^7.0.0/' \
              pubspec.yaml
          else
            echo "WARNING: google_mobile_ads not found"
          fi

          echo "Current AdMob dependency:"
          grep "google_mobile_ads:" pubspec.yaml || true

      - name: Migrate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          NEEDS_REGEN=false

          echo "Checking Android project..."

          if [ ! -d "android" ]; then
            NEEDS_REGEN=true
          elif [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ]; then
            NEEDS_REGEN=true
          elif [ -f "android/settings.gradle" ]; then
            if ! grep -q "dev.flutter.flutter-plugin-loader" android/settings.gradle; then
              NEEDS_REGEN=true
            fi
          elif [ -f "android/settings.gradle.kts" ]; then
            if ! grep -q "dev.flutter.flutter-plugin-loader" android/settings.gradle.kts; then
              NEEDS_REGEN=true
            fi
          fi

          ADMOB_ID=""
          APP_ID=""
          LABEL=""

          if [ "$NEEDS_REGEN" = true ]; then
            echo "Old Android project detected."
            echo "Regenerating Android project with Flutter 3.35..."

            if [ -d "android" ]; then
              rm -rf android_old
              mv android android_old
            fi

            OLD_MANIFEST="android_old/app/src/main/AndroidManifest.xml"

            PROJECT_NAME=$(sed -nE \
              's/^name:[[:space:]]*([A-Za-z0-9_]+).*/\1/p' \
              pubspec.yaml | head -1)

            if [ -z "$PROJECT_NAME" ]; then
              echo "ERROR: Could not determine Flutter project name"
              exit 1
            fi

            echo "Project name: $PROJECT_NAME"

            if [ -d "android_old" ]; then

              if [ -f "android_old/app/build.gradle" ]; then
                APP_ID=$(sed -nE \
                  's/.*applicationId[[:space:]]+"([^"]+)".*/\1/p' \
                  android_old/app/build.gradle | head -1 || true)
              fi

              if [ -z "$APP_ID" ] && [ -f "android_old/app/build.gradle.kts" ]; then
                APP_ID=$(sed -nE \
                  's/.*applicationId[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
                  android_old/app/build.gradle.kts | head -1 || true)
              fi

              if [ -f "$OLD_MANIFEST" ]; then
                ADMOB_ID=$(grep -hoE \
                  'ca-app-pub-[0-9]+~[0-9]+' \
                  "$OLD_MANIFEST" | head -1 || true)

                LABEL=$(sed -nE \
                  's/.*android:label="([^"]+)".*/\1/p' \
                  "$OLD_MANIFEST" | head -1 || true)
              fi
            fi

            ORG="com.example"

            if [ -n "$APP_ID" ]; then
              if [[ "$APP_ID" == *".$PROJECT_NAME" ]]; then
                ORG="${APP_ID%.$PROJECT_NAME}"
              fi
            fi

            echo "Application ID: ${APP_ID:-not found}"
            echo "Organization: $ORG"
            echo "AdMob ID: ${ADMOB_ID:-not found}"

            flutter create \
              --platforms=android \
              --org "$ORG" \
              --project-name "$PROJECT_NAME" \
              .

            if [ -n "$APP_ID" ]; then

              if [ -f "android/app/build.gradle" ]; then
                sed -i -E \
                  "s/applicationId[[:space:]]+\"[^\"]+\"/applicationId \"$APP_ID\"/" \
                  android/app/build.gradle
              fi

              if [ -f "android/app/build.gradle.kts" ]; then
                sed -i -E \
                  "s/applicationId[[:space:]]*=[[:space:]]*\"[^\"]+\"/applicationId = \"$APP_ID\"/" \
                  android/app/build.gradle.kts
              fi

            fi

            if [ -n "$LABEL" ] && [[ "$LABEL" != @* ]]; then
              sed -i -E \
                "s/android:label=\"[^\"]*\"/android:label=\"$LABEL\"/" \
                "$MANIFEST"
            fi

            if [ -d "android_old/app/src/main/res" ]; then
              cp -r \
                android_old/app/src/main/res/. \
                android/app/src/main/res/ \
                2>/dev/null || true
            fi

          else
            echo "Android project already uses modern Flutter embedding."
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          echo "Configuring AndroidManifest.xml..."

          sed -i \
            's/io\.flutter\.app\.FlutterActivity/io.flutter.embedding.android.FlutterActivity/g' \
            "$MANIFEST"

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i \
              '0,/<application/s#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' \
              "$MANIFEST"
          fi

          if ! grep -q 'android:name="flutterEmbedding"' "$MANIFEST"; then
            sed -i \
              's#</application>#        <meta-data android:name="flutterEmbedding" android:value="2" />\n    </application>#' \
              "$MANIFEST"
          fi

          if [ -z "$ADMOB_ID" ]; then
            ADMOB_ID="ca-app-pub-3940256099942544~3347511713"
            echo "Using Google test AdMob App ID."
          else
            echo "Using project AdMob App ID."
          fi

          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i \
              "s#</application>#        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_ID\" />\n    </application>#" \
              "$MANIFEST"
          fi

          xmllint --noout "$MANIFEST"

          echo "AndroidManifest.xml is VALID."

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Fix Flutter color constants
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Fixing unsupported Flutter color constants..."

          find lib -type f -name "*.dart" -print0 | while IFS= read -r -d '' FILE; do
            sed -i \
              's/Colors\.white06/const Color(0x0FFFFFFF)/g' \
              "$FILE"
          done

          echo "Checking remaining white06 references..."

          if grep -R "Colors\.white06" lib --include="*.dart"; then
            echo "ERROR: Colors.white06 still exists"
            exit 1
          fi

          echo "Color constants fixed successfully."

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personality-analyzer-arabic-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
